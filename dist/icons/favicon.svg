<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with iOS squircle shape -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  
  <!-- Sheet Graphic -->
  <g filter="url(#shadow)">
    <rect x="120" y="90" width="272" height="340" rx="20" fill="#ffffff" />
    <!-- Header banner on paper -->
    <rect x="150" y="130" width="120" height="18" rx="9" fill="#2563eb" />
    <rect x="150" y="165" width="212" height="10" rx="5" fill="#cbd5e1" />
    <rect x="150" y="190" width="180" height="10" rx="5" fill="#cbd5e1" />
    
    <!-- Checklist items -->
    <!-- Item 1 -->
    <circle cx="165" cy="245" r="14" fill="#10b981" />
    <path d="M159 245 l4 4 l8 -8" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="195" y="240" width="150" height="10" rx="5" fill="#64748b" />

    <!-- Item 2 -->
    <circle cx="165" cy="295" r="14" fill="#10b981" />
    <path d="M159 295 l4 4 l8 -8" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="195" y="290" width="130" height="10" rx="5" fill="#64748b" />

    <!-- Item 3 (active question) -->
    <circle cx="165" cy="345" r="14" fill="#3b82f6" />
    <circle cx="165" cy="345" r="6" fill="#ffffff" />
    <rect x="195" y="340" width="110" height="10" rx="5" fill="#64748b" />

    <!-- Bottom test accent badge -->
    <rect x="150" y="388" width="80" height="16" rx="8" fill="#e0e7ff" />
    <rect x="158" y="393" width="64" height="6" rx="3" fill="#4338ca" />
  </g>
</svg>
